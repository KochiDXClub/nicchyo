<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ecdf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AI Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%237ED957%27/%3E%3Crect x=%278%27 y=%278%27 width=%2716%27 height=%2712%27 rx=%273%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f3ecdf;
    --panel: #fffaf0;
    --ink: #3a3a3a;
    --ink-soft: #7a7468;
    --line: #e4dccb;
    --working: #3f9d4a;
    --waiting: #d9443b;
    --idle: #8a8578;
    --sleeping: #6b7fa8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden; overscroll-behavior: none;
    padding-top: env(safe-area-inset-top);
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  #conn { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); flex: none; }
  #conn.on { background: var(--working); }
  #conn.off { background: var(--waiting); }
  #counts { display: flex; gap: 6px; margin-left: auto; font-size: 12px; }
  .chip { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: #fff; white-space: nowrap; }
  .chip b { font-variant-numeric: tabular-nums; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #empty {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    padding: 24px; pointer-events: none; color: var(--ink-soft);
  }
  #empty.show { display: grid; }
  #empty div { max-width: 320px; background: color-mix(in srgb, var(--panel) 90%, transparent); padding: 14px 16px; border-radius: 12px; pointer-events: auto; }
  #empty a { color: var(--working); font-weight: 600; }
  #hint { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: var(--ink-soft); pointer-events: none; }
  aside {
    background: var(--panel); border-top: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
    max-height: 42dvh; padding-bottom: env(safe-area-inset-bottom);
  }
  aside.collapsed { max-height: 44px; }
  #handle {
    all: unset; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; font-weight: 600; font-size: 13px; min-height: 44px;
  }
  #handle::after { content: "▾"; color: var(--ink-soft); transition: transform .2s; }
  aside.collapsed #handle::after { transform: rotate(180deg); }
  #scroll { overflow-y: auto; padding: 0 12px 12px; -webkit-overflow-scrolling: touch; }
  #list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .card {
    all: unset; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 10px; align-items: center;
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 12px; background: #fff;
  }
  .card:focus-visible { outline: 2px solid var(--working); }
  .card.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .sw { width: 10px; height: 10px; border-radius: 3px; grid-row: 1 / span 2; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name small { font-weight: 400; color: var(--ink-soft); margin-left: 4px; }
  .st { font-size: 11px; font-weight: 600; color: #fff; padding: 1px 8px; border-radius: 999px; }
  .st.working { background: var(--working); } .st.waiting { background: var(--waiting); }
  .st.idle { background: var(--idle); } .st.sleeping { background: var(--sleeping); }
  .sub { grid-column: 2 / span 2; font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { margin: 12px 2px 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink-soft); }
  #log li { padding: 2px 0; border-top: 1px dashed var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log li:first-child { border-top: 0; }
  h2 { font-size: 12px; margin: 14px 2px 4px; color: var(--ink-soft); font-weight: 600; }
  @media (min-width: 900px) {
    main { flex-direction: row; }
    aside { width: 340px; max-height: none; border-top: 0; border-left: 1px solid var(--line); }
    aside.collapsed { max-height: none; }
    #list { grid-template-columns: 1fr; }
    #handle { cursor: default; }
    #handle::after { content: none; }
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #26231e; --panel: #2f2b25; --ink: #efe9dc; --ink-soft: #a79f8f; --line: #433e35; }
    .chip, .card { background: #38342d; }
  }
</style>
</head>
<body>
<header>
  <span id="conn" role="img" aria-label="接続状態"></span>
  <h1>AI Office</h1>
  <div id="counts" aria-live="polite"></div>
</header>
<main>
  <div id="stage">
    <div id="empty"><div>
      まだ誰も出社していません。<br>
      フックを設定して Claude のセッションを動かすと、ここに社員が現れます。<br>
      <a href="?demo=1">デモを見る</a>
    </div></div>
    <div id="hint">ドラッグで回転 / ピンチで拡大 / タップで選択</div>
  </div>
  <aside id="panel">
    <button id="handle" type="button" aria-expanded="true" aria-controls="scroll">社員一覧</button>
    <div id="scroll">
      <div id="list"></div>
      <h2>最近のできごと</h2>
      <ul id="log"></ul>
    </div>
  </aside>
</main>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<script type="module" src="/web/office.js"></script>
</body>
</html>
