name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [develop, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint / Type Check / Test / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # コード健康診断で PR の分岐点と比べるため、履歴ごと取得する
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # 共通化・デザインルールのビフォーアフターをジョブのサマリーに出す（docs/CODE_HEALTH.md）。
      # 運用に慣れるまでは失敗扱いにしない（--strict を付けない）
      - name: Code health
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/code-health/cli.mjs --base "origin/$BASE_REF" --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
