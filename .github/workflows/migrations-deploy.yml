name: Migrations Deploy

# ブランチに応じて、対応する Supabase プロジェクトにマイグレーションを適用する。
#   develop → 開発用プロジェクト（承認なし。push で自動適用）
#   main    → 本番プロジェクト（Environment `production` の承認後に適用）
# それ以外のブランチでは何もしない（手動実行も、実行したブランチの対象にしか向かない）。
# docs/RELEASE.md §4.4（main マージ）と同時に走る。
#
# 2 ジョブ構成（承認の前に差分を読めるようにするため）:
#   1. dry-run … 承認なしで走る。`migration list` と `db push --dry-run` の結果、
#                未適用ファイルに含まれる破壊的 SQL（DROP / DELETE / TRUNCATE 等）を
#                Step Summary に出す。DB には何も書き込まない。
#                Summary の先頭に「対象（開発/本番）」と「プロジェクトID」を出すので、承認前に確認すること。
#   2. apply   … 本番は Environment `production`（Required reviewers）の承認後に走る。
#                承認者は dry-run の Summary を読んでから承認すること。
#                dry-run 時点と未適用の集合が変わっていたら適用せずに止まる。
#
# - 未適用のマイグレーションだけが順に適用される（supabase_migrations.schema_migrations で管理）。
# - ロールバックは自動化しない。DB の巻き戻しは本番バックアップ（PITR）からの復元のみ
#   （docs/RELEASE.md §4.5）。本番は適用前に必ずバックアップ時刻を記録すること（§4.4 手順4）。
# - 適用後の回帰チェック（supabase/checks/*.sql）は DB に psql を張れないため自動化していない。
#   Supabase の SQL Editor で手動実行する（docs/RELEASE.md §4.4 手順13）。
#
# Environment（Settings → Environments）と、それぞれに登録するもの:
#   development        … develop 用。dry-run と apply の両方がこれを使う。Required reviewers は付けない。
#                         Deployment branches は `develop` のみに絞る。
#   production         … main の apply 用。Required reviewers を必ず設定する。Deployment branches は `main` のみ。
#   production-dry-run … main の dry-run 用。Required reviewers は付けない（承認前に差分を出すため）。
#                         Deployment branches は `main` のみ。
#   各 Environment に:
#     Secrets   SUPABASE_ACCESS_TOKEN … https://supabase.com/dashboard/account/tokens
#               SUPABASE_DB_PASSWORD  … そのプロジェクトの DB パスワード
#     Variables SUPABASE_PROJECT_ID   … そのプロジェクトの Reference ID（20文字）
#   プロジェクト ID は秘密ではないので Secrets ではなく Variables に置く。Secrets に置くと
#   GitHub が同じ文字列を `***` に伏せ、Summary やログで接続先を確認できなくなる。
#   （Environment の Secrets / Variables は、その Environment を指定したジョブにしか渡らない。
#     dry-run を environment なしで走らせると空になり link に失敗する。）
#
# 前提: 各プロジェクトの適用履歴とリポジトリが一致していること（docs/RELEASE.md §9）。

# main / develop 以外は jobs の `if` でスキップされるので、一覧でも「対象外」と出す。
run-name: Migrations Deploy → ${{ github.ref_name == 'main' && '本番' || github.ref_name == 'develop' && '開発' || '対象外' }}（${{ github.ref_name }}）

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '適用せずに差分だけ表示する'
        type: boolean
        default: true

permissions:
  contents: read

# 既定の `bash -e` には pipefail が無く、`supabase ... | tee` の失敗が握りつぶされるため明示する。
defaults:
  run:
    shell: bash

# 同じ対象には同時に2本走らせない。後から来たものはキャンセルせず順番待ちにする。
concurrency:
  group: supabase-migrations-${{ github.ref_name == 'main' && 'production' || 'development' }}
  cancel-in-progress: false

env:
  # DDL を流す CLI なので latest にしない。上げるときは dry-run で挙動を確かめてから。
  SUPABASE_CLI_VERSION: '2.120.0'
  # main は本番、develop は開発。ジョブの `if` で main / develop 以外は走らせない。
  TARGET_LABEL: ${{ github.ref_name == 'main' && '本番' || '開発' }}
  TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}

jobs:
  dry-run:
    name: ドライラン（${{ github.ref_name == 'main' && '本番' || '開発' }}・承認前に差分を確認）
    # main / develop 以外のブランチからの手動実行では何もしない（本番や開発に届かせない）。
    if: ${{ github.ref_name == 'main' || github.ref_name == 'develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 承認なしで走らせるが、Secrets / Variables を受け取るために Environment を使う（上記ヘッダ参照）。
    environment:
      name: ${{ github.ref_name == 'main' && 'production-dry-run' || 'development' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    outputs:
      pending_hash: ${{ steps.pending.outputs.pending_hash }}
      pending_count: ${{ steps.pending.outputs.pending_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # supabase/setup-cli v1.7.3（コミット SHA で固定）
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Ensure supabase/config.toml
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --force --yes >/dev/null
          fi

      # どのプロジェクトに向かうかを Summary の先頭に出す。承認者はここを読んでから承認する。
      - name: Show target project
        env:
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          if ! [[ "$PROJECT_ID" =~ ^[a-z]{20}$ ]]; then
            echo "::error::Environment の Variable SUPABASE_PROJECT_ID が未設定、または形式が違います（20文字の Reference ID）。Variables に登録してください（Secrets ではない）。"
            exit 1
          fi
          {
            echo "## 対象: ${TARGET_LABEL}（ブランチ \`${GITHUB_REF_NAME}\`）"
            echo "- プロジェクトID: \`${PROJECT_ID}\`"
            echo "- [Supabase ダッシュボード](https://supabase.com/dashboard/project/${PROJECT_ID})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Link project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"

      # リモートの履歴とリポジトリの差分を常にログに残す
      - name: Migration status
        run: supabase migration list --linked

      # リモートとローカルの履歴乖離を事前検知し、原因と解決策をわかりやすく報告する
      - name: Validate migration sync status
        run: |
          list_output=$(supabase migration list --linked 2>&1 || true)
          # Remote側にあってLocal側にないバージョンを検出 (LOCAL列が空白でREMOTE列に14桁タイムスタンプが存在する行)
          missing_versions=$(echo "$list_output" | awk -F '|' 'NF >= 3 && $1 ~ /^[[:space:]]*$/ && $2 ~ /[0-9]{14}/ {gsub(/[[:space:]]/, "", $2); print $2}')

          if [ -n "$missing_versions" ]; then
            echo "::error::リモートDB側にローカルリポジトリに存在しないバージョンが検出されました: $missing_versions"
            {
              echo "### ⚠️ リモートDBとのマイグレーション履歴乖離を検出"
              echo "リモートDBに記録されていますが、現在のブランチ（\`supabase/migrations/\`）に存在しないバージョンがあります："
              echo '```'
              echo "$missing_versions"
              echo '```'
              echo "**対処方法**:"
              echo "1. 不要な履歴・テスト実行履歴の場合:"
              echo "   \`supabase migration repair --status reverted $missing_versions\`"
              echo "2. 他のPRやブランチで適用された変更の場合、最新のブランチを取り込んでから再実行してください。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Dry run
        run: supabase db push --linked --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"

      # 未適用ファイルの一覧と、その中の破壊的 SQL を Summary に出す。承認者はここを読んでから承認する。
      - name: Summarize pending migrations
        id: pending
        run: |
          pending_hash=$(scripts/ci/pending-migrations.sh "$RUNNER_TEMP/dry-run.txt" "$RUNNER_TEMP/pending.txt")
          count=$(wc -l < "$RUNNER_TEMP/pending.txt" | tr -d ' ')
          echo "pending_count=$count" >> "$GITHUB_OUTPUT"
          echo "pending_hash=$pending_hash" >> "$GITHUB_OUTPUT"

          {
            echo "### ドライラン結果（${TARGET_LABEL}）: 未適用 ${count} 件"
            if [ "$count" -eq 0 ]; then
              echo "${TARGET_LABEL}に未適用のマイグレーションはありません。"
            else
              echo '```'
              cat "$RUNNER_TEMP/pending.txt"
              echo '```'
              echo '#### 破壊的・不可逆になりうる文（要確認）'
              echo "DROP / DELETE FROM / TRUNCATE / REVOKE を含む行（\`--\` コメント行は除外）。"
              if [ "$TARGET_ENV" = "production" ]; then
                echo '該当があれば、バックアップ（PITR）時刻を記録済みか、日曜市の開催時間外かを確認してから承認すること（docs/RELEASE.md §4.4）。'
              fi
              echo '```'
              scripts/ci/destructive-statements.sh "$RUNNER_TEMP/pending.txt"
              echo '```'
              echo "#### \`db push --dry-run\` の出力"
              echo '```'
              cat "$RUNNER_TEMP/dry-run.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: ${{ github.ref_name == 'main' && '本番 Supabase へ適用（要承認）' || '開発 Supabase へ適用' }}
    needs: dry-run
    # push は常に適用。手動実行は dry_run=false のときだけ。未適用が0件なら承認を求めずに終える。
    if: ${{ (github.ref_name == 'main' || github.ref_name == 'develop') && (github.event_name == 'push' || inputs.dry_run == false) && needs.dry-run.outputs.pending_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # environment.url には secrets コンテキストを渡せない（許可されているのは
    # github / inputs / vars / needs / strategy / matrix / job / runner / env / steps）。
    # ここに secrets を書くとワークフローの検証に失敗し、ジョブが1つも作られないまま
    # 全 push で失敗ランになる。ダッシュボードのリンクは dry-run ジョブで出す。
    # Required reviewers の承認待ちは、このジョブの開始前に入る（= dry-run の Summary を読んでから承認できる）。
    # 本番（main）は Required reviewers の承認待ちが入る。開発（develop）は承認なしで進む。
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # supabase/setup-cli v1.7.3（コミット SHA で固定）
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Ensure supabase/config.toml
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --force --yes >/dev/null
          fi

      - name: Show target project
        env:
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          if ! [[ "$PROJECT_ID" =~ ^[a-z]{20}$ ]]; then
            echo "::error::Environment の Variable SUPABASE_PROJECT_ID が未設定、または形式が違います（20文字の Reference ID）。"
            exit 1
          fi
          {
            echo "## 適用先: ${TARGET_LABEL}（ブランチ \`${GITHUB_REF_NAME}\`）"
            echo "- プロジェクトID: \`${PROJECT_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Link project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"

      # 承認待ちの間に未適用の集合が変わっていないか（承認した差分と同じものを適用するか）を確かめる
      - name: Verify pending set matches the approved dry run
        env:
          APPROVED_HASH: ${{ needs.dry-run.outputs.pending_hash }}
          APPROVED_COUNT: ${{ needs.dry-run.outputs.pending_count }}
        run: |
          supabase db push --linked --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"
          now_hash=$(scripts/ci/pending-migrations.sh "$RUNNER_TEMP/dry-run.txt" "$RUNNER_TEMP/pending.txt")
          if [ "$now_hash" != "$APPROVED_HASH" ]; then
            echo "::error::承認時のドライラン（${APPROVED_COUNT} 件）と未適用の集合が変わっています。ドライランからやり直してください。"
            exit 1
          fi

      - name: Apply migrations
        run: supabase db push --linked --include-all

      - name: Migration status (after)
        run: supabase migration list --linked

      - name: Post-apply checklist
        run: |
          {
            echo "### 適用後に手動で確認すること"
            echo "1. Supabase ダッシュボードの SQL Editor で \`supabase/checks/*.sql\` を貼って実行する（どちらも読み取りのみ。エラーが出たら異常）。"
            echo "2. \`Migration status (after)\` で Local と Remote の履歴が揃っていることを確認する。"
            if [ "$TARGET_ENV" = "production" ]; then
              echo "3. docs/RELEASE.md §4.4 の手順14（メンテナンス解除）と手順15（本番確認）を実施する。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
