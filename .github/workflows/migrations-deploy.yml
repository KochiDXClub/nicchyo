name: Migrations Deploy (Production)

# main にマージされたマイグレーションを本番 Supabase に適用する。
# docs/RELEASE.md §4.4（main マージ）と同時に走る。
#
# 2 ジョブ構成（承認の前に差分を読めるようにするため）:
#   1. dry-run … 承認なしで走る。`migration list` と `db push --dry-run` の結果、
#                未適用ファイルに含まれる破壊的 SQL（DROP / DELETE / TRUNCATE 等）を
#                Step Summary に出す。本番には何も書き込まない。
#   2. apply   … Environment `production`（Required reviewers）の承認後に走る。
#                承認者は dry-run の Summary を読んでから承認すること。
#                dry-run 時点と未適用の集合が変わっていたら適用せずに止まる。
#
# - 未適用のマイグレーションだけが順に適用される（supabase_migrations.schema_migrations で管理）。
# - ロールバックは自動化しない。DB の巻き戻しは本番バックアップ（PITR）からの復元のみ
#   （docs/RELEASE.md §4.5）。適用前に必ずバックアップ時刻を記録すること（§4.4 手順4）。
# - 適用後の回帰チェック（supabase/checks/*.sql）は本番に psql を張れないため自動化していない。
#   Supabase の SQL Editor で手動実行する（docs/RELEASE.md §4.4 手順13）。
#
# 必要な Secrets（Environment に登録。Repository secrets には置かない）:
#   SUPABASE_ACCESS_TOKEN  … https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    … 本番プロジェクトの Reference ID
#   SUPABASE_DB_PASSWORD   … 本番DBパスワード
# 登録先の Environment:
#   - `production`          … apply ジョブ用。Required reviewers を必ず設定する。
#   - `production-dry-run`  … dry-run ジョブ用。上と同じ3つの Secrets を登録する。
#                              Required reviewers は付けない（承認前に差分を出すため）。
#                              Deployment branches は `main` のみに絞る。
#   （Environment Secrets は、その Environment を指定したジョブにしか渡らない。
#     dry-run を environment なしで走らせると Secrets が空になり link に失敗する。）
#
# 前提: 本番の適用履歴とリポジトリが一致していること（docs/RELEASE.md §9）。

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '適用せずに差分だけ表示する'
        type: boolean
        default: true

permissions:
  contents: read

# 既定の `bash -e` には pipefail が無く、`supabase ... | tee` の失敗が握りつぶされるため明示する。
defaults:
  run:
    shell: bash

# 同時に2本走らせない。後から来たものはキャンセルせず順番待ちにする。
concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

env:
  # 本番DDLを流す CLI なので latest にしない。上げるときは dry-run で挙動を確かめてから。
  SUPABASE_CLI_VERSION: '2.120.0'

jobs:
  dry-run:
    name: ドライラン（承認前に差分を確認）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 承認なしで走らせるが、Secrets を受け取るために専用 Environment を使う（上記ヘッダ参照）。
    environment:
      name: production-dry-run
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    outputs:
      pending_hash: ${{ steps.pending.outputs.pending_hash }}
      pending_count: ${{ steps.pending.outputs.pending_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # supabase/setup-cli v1.7.3（コミット SHA で固定）
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Ensure supabase/config.toml
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --force --yes >/dev/null
          fi

      - name: Link production project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Dashboard link
        run: |
          echo "[本番 Supabase ダッシュボード](https://supabase.com/dashboard/project/${{ secrets.SUPABASE_PROJECT_ID }})" >> "$GITHUB_STEP_SUMMARY"

      # 本番の履歴とリポジトリの差分を常にログに残す
      - name: Migration status
        run: supabase migration list --linked

      # リモートとローカルの履歴乖離を事前検知し、原因と解決策をわかりやすく報告する
      - name: Validate migration sync status
        run: |
          list_output=$(supabase migration list --linked 2>&1 || true)
          # Remote側にあってLocal側にないバージョンを検出 (LOCAL列が空白でREMOTE列に14桁タイムスタンプが存在する行)
          missing_versions=$(echo "$list_output" | awk -F '|' 'NF >= 3 && $1 ~ /^[[:space:]]*$/ && $2 ~ /[0-9]{14}/ {gsub(/[[:space:]]/, "", $2); print $2}')

          if [ -n "$missing_versions" ]; then
            echo "::error::リモートDB側にローカルリポジトリに存在しないバージョンが検出されました: $missing_versions"
            {
              echo "### ⚠️ リモートDBとのマイグレーション履歴乖離を検出"
              echo "リモートDBに記録されていますが、現在のブランチ（\`supabase/migrations/\`）に存在しないバージョンがあります："
              echo '```'
              echo "$missing_versions"
              echo '```'
              echo "**対処方法**:"
              echo "1. 不要な履歴・テスト実行履歴の場合:"
              echo "   \`supabase migration repair --status reverted $missing_versions\`"
              echo "2. 他のPRやブランチで適用された変更の場合、最新のブランチを取り込んでから再実行してください。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Dry run
        run: supabase db push --linked --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"

      # 未適用ファイルの一覧と、その中の破壊的 SQL を Summary に出す。承認者はここを読んでから承認する。
      - name: Summarize pending migrations
        id: pending
        run: |
          pending_hash=$(scripts/ci/pending-migrations.sh "$RUNNER_TEMP/dry-run.txt" "$RUNNER_TEMP/pending.txt")
          count=$(wc -l < "$RUNNER_TEMP/pending.txt" | tr -d ' ')
          echo "pending_count=$count" >> "$GITHUB_OUTPUT"
          echo "pending_hash=$pending_hash" >> "$GITHUB_OUTPUT"

          {
            echo "### ドライラン結果: 未適用 ${count} 件"
            if [ "$count" -eq 0 ]; then
              echo "本番に未適用のマイグレーションはありません。"
            else
              echo '```'
              cat "$RUNNER_TEMP/pending.txt"
              echo '```'
              echo '#### 破壊的・不可逆になりうる文（要確認）'
              echo "DROP / DELETE FROM / TRUNCATE / REVOKE を含む行（\`--\` コメント行は除外）。"
              echo '該当があれば、バックアップ（PITR）時刻を記録済みか、日曜市の開催時間外かを確認してから承認すること（docs/RELEASE.md §4.4）。'
              echo '```'
              scripts/ci/destructive-statements.sh "$RUNNER_TEMP/pending.txt"
              echo '```'
              echo "#### \`db push --dry-run\` の出力"
              echo '```'
              cat "$RUNNER_TEMP/dry-run.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: 本番 Supabase へ適用（要承認）
    needs: dry-run
    # push は常に適用。手動実行は dry_run=false のときだけ。未適用が0件なら承認を求めずに終える。
    if: ${{ (github.event_name == 'push' || inputs.dry_run == false) && needs.dry-run.outputs.pending_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # environment.url には secrets コンテキストを渡せない（許可されているのは
    # github / inputs / vars / needs / strategy / matrix / job / runner / env / steps）。
    # ここに secrets を書くとワークフローの検証に失敗し、ジョブが1つも作られないまま
    # 全 push で失敗ランになる。ダッシュボードのリンクは dry-run ジョブで出す。
    # Required reviewers の承認待ちは、このジョブの開始前に入る（= dry-run の Summary を読んでから承認できる）。
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # supabase/setup-cli v1.7.3（コミット SHA で固定）
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Ensure supabase/config.toml
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --force --yes >/dev/null
          fi

      - name: Link production project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      # 承認待ちの間に未適用の集合が変わっていないか（承認した差分と同じものを適用するか）を確かめる
      - name: Verify pending set matches the approved dry run
        env:
          APPROVED_HASH: ${{ needs.dry-run.outputs.pending_hash }}
          APPROVED_COUNT: ${{ needs.dry-run.outputs.pending_count }}
        run: |
          supabase db push --linked --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"
          now_hash=$(scripts/ci/pending-migrations.sh "$RUNNER_TEMP/dry-run.txt" "$RUNNER_TEMP/pending.txt")
          if [ "$now_hash" != "$APPROVED_HASH" ]; then
            echo "::error::承認時のドライラン（${APPROVED_COUNT} 件）と未適用の集合が変わっています。ドライランからやり直してください。"
            exit 1
          fi

      - name: Apply migrations
        run: supabase db push --linked --include-all

      - name: Migration status (after)
        run: supabase migration list --linked

      - name: Post-apply checklist
        run: |
          {
            echo "### 適用後に手動で確認すること"
            echo "1. Supabase ダッシュボードの SQL Editor で \`supabase/checks/*.sql\` を貼って実行する（どちらも読み取りのみ。エラーが出たら異常）。"
            echo "2. \`Migration status (after)\` で Local と Remote の履歴が揃っていることを確認する。"
            echo "3. docs/RELEASE.md §4.4 の手順14（メンテナンス解除）と手順15（本番確認）を実施する。"
          } >> "$GITHUB_STEP_SUMMARY"
